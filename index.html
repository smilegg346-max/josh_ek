<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sky Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,8,18,.75);z-index:20}
.panel{width:min(520px,90vw);text-align:center;padding:30px 20px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:#0d1b30}
h1{margin:0 0 10px;font-size:46px}
p{color:#b8c7dc;line-height:1.5}
button{border:0;border-radius:14px;padding:14px 32px;font-size:20px;font-weight:bold;background:#ffd34d;color:#17120a}
#help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;opacity:.7;z-index:5;pointer-events:none;text-align:center;white-space:nowrap}
#joy{display:none;position:fixed;left:22px;bottom:22px;width:160px;height:160px;border-radius:50%;background:rgba(30,45,70,.55);border:2px solid rgba(255,255,255,.25);z-index:10;touch-action:none}
#stick{position:absolute;width:66px;height:66px;left:47px;top:47px;border-radius:50%;background:rgba(255,211,77,.9);border:2px solid #fff;pointer-events:none}
@media (pointer:coarse),(max-width:700px){
 #joy{display:block}
 #help{font-size:11px;bottom:7px}
 h1{font-size:38px}
}

#hud{position:fixed;left:0;right:0;top:0;height:58px;background:rgba(4,10,20,.62);z-index:15;display:none;align-items:center;gap:18px;padding:0 14px;font-weight:bold}
#hud .value{color:#ffd34d}
#menuButton{margin-left:auto;padding:8px 12px;border-radius:10px;background:#ffffff18;color:#fff;font-size:14px}
#tabs{display:flex;justify-content:center;gap:7px;margin:12px 0}
.tab{padding:9px 12px;background:#ffffff12;color:#fff;border-radius:10px;font-size:14px}
.tab.active{background:#ffffff25}
.section{display:none}.section.active{display:block}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left}
.card{padding:11px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff12}
.card.locked{opacity:.48}
.skinDot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:5px}
.smallBtn{margin-top:8px;padding:8px 12px;border-radius:10px;background:#ffd34d;color:#17120a;font-weight:bold;font-size:13px}
.smallBtn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:600px){.cards{grid-template-columns:1fr}.panel{max-height:88vh;overflow:auto}}

</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  ⭐ <span class="value" id="hudScore">0</span>
  <b>LEVEL <span class="value" id="hudLevel">1</span></b>
  🏆 <span class="value" id="hudBest">0</span>
  <button id="menuButton" type="button">MENU</button>
</div>

<div id="start">
  <div class="panel">
    <h1>SKY RUSH</h1>
    <p>Collect stars, dodge meteors, level up, unlock skins and earn achievements!</p>
    <div id="tabs">
      <button class="tab active" data-tab="playSection" type="button">PLAY</button>
      <button class="tab" data-tab="skinSection" type="button">SKINS</button>
      <button class="tab" data-tab="achSection" type="button">ACHIEVEMENTS</button>
    </div>
    <div id="playSection" class="section active">
      <p id="progress"></p>
      <button id="play" type="button">PLAY</button>
    </div>
    <div id="skinSection" class="section">
      <h2>SKINS</h2>
      <p>Unlock skins for free by collecting stars.</p>
      <div class="cards" id="skinCards"></div>
    </div>
    <div id="achSection" class="section">
      <h2>ACHIEVEMENTS</h2>
      <div class="cards" id="achCards"></div>
    </div>
  </div>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="help">PC: WASD / Arrows &nbsp; • &nbsp; Phone: joystick</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const play=document.getElementById("play");
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let W=innerWidth,H=innerHeight,dpr=1;
let player,stars,meteors,particles,score,best=0,level=1,gameOver=false,running=false,last=0;
const keys=Object.create(null);

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth; H=innerHeight;
 canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); resize();

try{best=Number(localStorage.getItem("skyRushBest")||0)}catch(e){}

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function spawnStar(){stars.push({x:rand(35,Math.max(36,W-35)),y:rand(80,Math.max(81,H-35)),r:11})}
function spawnMeteor(){
 const s=Math.floor(rand(0,4)); let x,y,vx,vy;
 if(s===0){x=-30;y=rand(0,H);vx=rand(2,4);vy=rand(-1.5,1.5)}
 if(s===1){x=W+30;y=rand(0,H);vx=-rand(2,4);vy=rand(-1.5,1.5)}
 if(s===2){x=rand(0,W);y=-30;vx=rand(-1.5,1.5);vy=rand(2,4)}
 if(s===3){x=rand(0,W);y=H+30;vx=rand(-1.5,1.5);vy=-rand(2,4)}
 meteors.push({x,y,vx,vy,r:rand(15+level*0.8,25+level*1.2)})
}
function burst(x,y,n=16){
 for(let i=0;i<n;i++){
  const a=rand(0,Math.PI*2),s=rand(1,5);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(2,5)})
 }
}

const SKINS={
 blue:{name:"Blue",color:"#4fc3ff",glow:"rgba(82,190,255,.5)",need:0,style:"classic"},
 red:{name:"Crimson Fighter",color:"#ff5d66",glow:"rgba(255,93,102,.5)",need:50,style:"fighter"},
 purple:{name:"Void Orb",color:"#b56cff",glow:"rgba(181,108,255,.5)",need:150,style:"orb"},
 green:{name:"Emerald Dragon",color:"#5df0a2",glow:"rgba(93,240,162,.5)",need:300,style:"dragon"},
 gold:{name:"Golden Star",color:"#ffd34d",glow:"rgba(255,211,77,.5)",need:500,style:"star"},
 cyan:{name:"Cyber Cube",color:"#48e7ff",glow:"rgba(72,231,255,.5)",need:750,style:"cube"},
 pink:{name:"Cosmic Heart",color:"#ff6fcf",glow:"rgba(255,111,207,.5)",need:1000,style:"heart"},
 orange:{name:"Solar Flame",color:"#ff9b3d",glow:"rgba(255,155,61,.5)",need:1500,style:"flame"},
 ice:{name:"Ice Crystal",color:"#b9f4ff",glow:"rgba(185,244,255,.5)",need:2000,style:"crystal"},
 black:{name:"Shadow Reaper",color:"#8d8d9c",glow:"rgba(80,80,100,.7)",need:3000,style:"reaper"},
 rainbow:{name:"Prismatic Nova",color:"#ffffff",glow:"rgba(255,255,255,.7)",need:5000,style:"rainbow"}
};
const ACHIEVEMENTS=[
 ["first","First Flight","Play your first game."],
 ["stars50","Star Collector","Collect 50 total stars."],
 ["stars200","Star Hunter","Collect 200 total stars."],
 ["level5","Getting Good","Reach level 5."],
 ["level10","Sky Master","Reach level 10."],
 ["score250","High Flyer","Score 250 points in one run."],
 ["score500","Sky Legend","Score 500 points in one run."],
 ["stars500","Star Hoarder","Collect 500 total stars."],
 ["level15","Meteor Master","Reach level 15."],
 ["score1000","Unstoppable","Score 1,000 points in one run."],
 ["stars1000","Star Millionaire","Collect 1,000 total stars."],
 ["level20","Cosmic Champion","Reach level 20."]
];
let save;
try{save=JSON.parse(localStorage.getItem("skyRushSave")||"null")}catch(e){save=null}
if(!save)save={best:0,totalStars:0,selected:"blue",owned:["blue"],ach:{},games:0};
function persist(){try{localStorage.setItem("skyRushSave",JSON.stringify(save))}catch(e){}}
function unlock(id){if(!save.ach[id]){save.ach[id]=true;persist()}}
function renderMenu(){
 document.getElementById("progress").textContent=`Best: ${Math.floor(save.best)} • Total stars: ${save.totalStars} • Skin: ${SKINS[save.selected].name}`;
 const sc=document.getElementById("skinCards");sc.innerHTML="";
 for(const [id,s] of Object.entries(SKINS)){
  const owned=save.owned.includes(id),d=document.createElement("div");
  d.className="card"+(owned?"":" locked");
  d.innerHTML=`<b><span class="skinDot" style="background:${s.color}"></span>${s.name}</b><br><small>${owned?"Unlocked":"Need "+s.need+" stars"}</small><br>`;
  const b=document.createElement("button");b.className="smallBtn";
  b.textContent=owned?(save.selected===id?"EQUIPPED":"EQUIP"):"LOCKED";b.disabled=!owned;
  if(owned)b.onclick=()=>{save.selected=id;persist();renderMenu()};
  d.appendChild(b);sc.appendChild(d);
 }
 const ac=document.getElementById("achCards");ac.innerHTML="";
 for(const [id,name,desc] of ACHIEVEMENTS){
  const d=document.createElement("div");d.className="card"+(save.ach[id]?"":" locked");
  d.innerHTML=`<b>${save.ach[id]?"🏆":"🔒"} ${name}</b><br><small>${desc}</small>`;
  ac.appendChild(d);
 }
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");
}));

function reset(){
 player={x:W/2,y:H/2,r:18,speed:5.4};
 stars=[];meteors=[];particles=[];score=0;level=1;gameOver=false;update.starTimer=0;update.spawnTimer=0;
 for(let i=0;i<3;i++)spawnStar();
 for(let i=0;i<2;i++)spawnMeteor();
}

function startGame(e){
 if(e)e.preventDefault();
 start.style.display="none";
 document.getElementById("hud").style.display="flex";
 running=true;
 save.games++;unlock("first");persist();
 reset();
}
play.addEventListener("click",startGame);
play.addEventListener("touchend",startGame,{passive:false});
document.getElementById("menuButton").addEventListener("click",()=>{
 running=false;gameOver=false;
 document.getElementById("hud").style.display="none";
 start.style.display="flex";renderMenu();
});

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space"&&gameOver)reset();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* Touch joystick */
let touching=false;
function joystick(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy;
 const max=r.width/2-34;
 const len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max}
 stick.style.transform=`translate(${x}px,${y}px)`;
 const dead=max*.18;
 keys.left=x < -dead; keys.right=x > dead;
 keys.up=y < -dead; keys.down=y > dead;
}
function stopJoy(){
 touching=false;
 stick.style.transform="";
 keys.left=keys.right=keys.up=keys.down=false;
}
joy.addEventListener("pointerdown",e=>{
 e.preventDefault();touching=true;
 try{joy.setPointerCapture(e.pointerId)}catch(_){}
 if(gameOver)reset();
 joystick(e);
});
joy.addEventListener("pointermove",e=>{if(touching)joystick(e)});
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);
joy.addEventListener("lostpointercapture",stopJoy);

function update(dt){
 if(gameOver)return;
 let dx=(keys.d||keys.arrowright||keys.right?1:0)-(keys.a||keys.arrowleft||keys.left?1:0);
 let dy=(keys.s||keys.arrowdown||keys.down?1:0)-(keys.w||keys.arrowup||keys.up?1:0);
 if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;player.x+=dx*player.speed*dt*60;player.y+=dy*player.speed*dt*60}
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(65,Math.min(H-player.r,player.y));

 score+=dt*1.5;level=Math.min(100,1+Math.floor(score/250));
 document.getElementById("hudScore").textContent=Math.floor(score);
 document.getElementById("hudLevel").textContent=level;
 document.getElementById("hudBest").textContent=Math.floor(save.best);
 if(level>=5)unlock("level5");
 if(level>=10)unlock("level10");
  if(level>=15)unlock("level15");
  if(level>=20)unlock("level20");
 if(score>=250)unlock("score250");
 if(score>=500)unlock("score500");
  if(score>=1000)unlock("score1000");

 if(!update.starTimer)update.starTimer=0;if(!update.spawnTimer)update.spawnTimer=0;
 update.starTimer+=dt;update.spawnTimer+=dt;
 if(update.starTimer>Math.max(1.2,2.2-level*.08)&&stars.length<5){spawnStar();update.starTimer=0}
 if(update.spawnTimer>Math.max(0.18,1.4-level*0.04)){
  spawnMeteor();
  update.spawnTimer=0;
}

 for(const m of meteors){m.x+=m.vx*dt*60*(1+level*0.18);m.y+=m.vy*dt*60*(1+level*0.18)}
 meteors=meteors.filter(m=>m.x>-80&&m.x<W+80&&m.y>-80&&m.y<H+80);

 for(let i=stars.length-1;i>=0;i--)if(dist(player,stars[i])<player.r+stars[i].r){
  score+=10;save.totalStars++;burst(stars[i].x,stars[i].y,18);stars.splice(i,1);
  if(save.totalStars>=50&&!save.owned.includes("red"))save.owned.push("red");
  if(save.totalStars>=150&&!save.owned.includes("purple"))save.owned.push("purple");
  if(save.totalStars>=300&&!save.owned.includes("green"))save.owned.push("green");
  if(save.totalStars>=500&&!save.owned.includes("gold"))save.owned.push("gold");
  if(save.totalStars>=750&&!save.owned.includes("cyan"))save.owned.push("cyan");
  if(save.totalStars>=1000&&!save.owned.includes("pink"))save.owned.push("pink");
  if(save.totalStars>=1500&&!save.owned.includes("orange"))save.owned.push("orange");
  if(save.totalStars>=2000&&!save.owned.includes("ice"))save.owned.push("ice");
  if(save.totalStars>=3000&&!save.owned.includes("black"))save.owned.push("black");
  if(save.totalStars>=5000&&!save.owned.includes("rainbow"))save.owned.push("rainbow");
  if(save.totalStars>=50)unlock("stars50");
  if(save.totalStars>=200)unlock("stars200");
  if(save.totalStars>=500)unlock("stars500");
  if(save.totalStars>=1000)unlock("stars1000");
  persist();
 }
 for(const m of meteors)if(dist(player,m)<player.r+m.r-5){
  burst(player.x,player.y,35);gameOver=true;save.best=Math.max(save.best,Math.floor(score));persist();
 }
 particles.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt*1.7;p.vx*=.98;p.vy*=.98});
 particles=particles.filter(p=>p.life>0);
}

function drawPlayer(){
 const s=SKINS[save.selected];
 ctx.save();ctx.translate(player.x,player.y);
 const glow=ctx.createRadialGradient(0,0,2,0,0,50);
 glow.addColorStop(0,s.glow);glow.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.fill();

 if(s.style==="fighter"){
  ctx.fillStyle=s.color;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(18,15);ctx.lineTo(7,12);ctx.lineTo(0,22);ctx.lineTo(-7,12);ctx.lineTo(-18,15);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-7,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff9b5c";ctx.fillRect(-12,15,6,8);ctx.fillRect(6,15,6,8);
 }else if(s.style==="orb"){
  ctx.strokeStyle=s.color;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,25,10,-.45,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#24123d";ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#e6c8ff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(-5,-4,5,0,Math.PI*2);ctx.stroke();
 }else if(s.style==="dragon"){
  ctx.fillStyle=s.color;ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(18,-6);ctx.lineTo(14,16);ctx.lineTo(0,22);ctx.lineTo(-14,16);ctx.lineTo(-18,-6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#b8ffe0";ctx.beginPath();ctx.moveTo(-13,-12);ctx.lineTo(-22,-24);ctx.lineTo(-9,-17);ctx.fill();ctx.beginPath();ctx.moveTo(13,-12);ctx.lineTo(22,-24);ctx.lineTo(9,-17);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-6,-4,3,0,Math.PI*2);ctx.arc(6,-4,3,0,Math.PI*2);ctx.fill();
 }else if(s.style==="star"){
  starPath(0,0,23,-Math.PI/2);ctx.fillStyle=s.color;ctx.shadowBlur=18;ctx.shadowColor=s.color;ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-7,-2,4,0,Math.PI*2);ctx.arc(7,-2,4,0,Math.PI*2);ctx.fill();
 }else if(s.style==="cube"){
  ctx.fillStyle=s.color;ctx.fillRect(-19,-19,38,38);
  ctx.strokeStyle="#d9fbff";ctx.lineWidth=3;ctx.strokeRect(-12,-12,24,24);
  ctx.fillStyle="#12343d";ctx.fillRect(-9,-4,6,6);ctx.fillRect(3,-4,6,6);
 }else if(s.style==="heart"){
  ctx.fillStyle=s.color;ctx.beginPath();ctx.moveTo(0,20);ctx.bezierCurveTo(-35,-2,-17,-25,0,-10);ctx.bezierCurveTo(17,-25,35,-2,0,20);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-7,-3,3,0,Math.PI*2);ctx.arc(7,-3,3,0,Math.PI*2);ctx.fill();
 }else if(s.style==="flame"){
  ctx.fillStyle=s.color;ctx.beginPath();ctx.moveTo(0,24);ctx.bezierCurveTo(-22,10,-18,-7,-6,-17);ctx.bezierCurveTo(-7,-4,4,-4,2,-24);ctx.bezierCurveTo(20,-8,22,10,0,24);ctx.fill();
  ctx.fillStyle="#fff0b0";ctx.beginPath();ctx.arc(0,7,6,0,Math.PI*2);ctx.fill();
 }else if(s.style==="crystal"){
  ctx.fillStyle=s.color;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(19,-8);ctx.lineTo(11,20);ctx.lineTo(-11,20);ctx.lineTo(-19,-8);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(7,0);ctx.lineTo(0,16);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();
 }else if(s.style==="reaper"){
  ctx.fillStyle="#181824";ctx.beginPath();ctx.arc(0,2,17,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=s.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,-8);ctx.quadraticCurveTo(0,-30,18,-8);ctx.stroke();
  ctx.fillStyle="#ff4f6d";ctx.beginPath();ctx.arc(-6,1,3,0,Math.PI*2);ctx.arc(6,1,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-12,19);ctx.lineTo(12,-20);ctx.stroke();
 }else if(s.style==="rainbow"){
  for(let i=0;i<6;i++){ctx.beginPath();ctx.strokeStyle=`hsl(${i*60},100%,65%)`;ctx.lineWidth=5;ctx.arc(0,0,10+i*3,0,Math.PI*2);ctx.stroke()}
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-6,-2,3,0,Math.PI*2);ctx.arc(6,-2,3,0,Math.PI*2);ctx.fill();
 }else{
  ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#e9f8ff";ctx.beginPath();ctx.arc(-6,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#12243c";ctx.beginPath();ctx.arc(-7,-5,2,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function draw(){
 if(player)drawPlayer();
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#0b2340");g.addColorStop(1,"#07101d");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.fillStyle="rgba(255,255,255,.6)";
 for(let i=0;i<90;i++){ctx.globalAlpha=.25+((i*17)%70)/100;ctx.fillRect((i*97)%W,(i*53)%H,2,2)}
 ctx.globalAlpha=1;

 ctx.fillStyle="rgba(4,10,20,.55)";ctx.fillRect(0,0,W,58);
 ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.fillText("⭐ "+Math.floor(score),22,36);
 ctx.fillStyle="#9fb2cc";ctx.font="15px Arial";ctx.fillText("BEST: "+best,140,36);

 if(player){
  const glow=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,45);
  glow.addColorStop(0,"rgba(82,190,255,.5)");glow.addColorStop(1,"rgba(82,190,255,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(player.x,player.y,45,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=SKINS[save.selected].color;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#e9f8ff";ctx.beginPath();ctx.arc(player.x-6,player.y-5,5,0,Math.PI*2);ctx.fill();
 }

 for(const s of stars){
  ctx.fillStyle="#ffd34d";ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5;const r=i%2?s.r:s.r*.42;const x=s.x+Math.cos(a)*r,y=s.y+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.closePath();ctx.fill();
 }
 for(const m of meteors){
  ctx.fillStyle="#d94b4b";ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff9b4a";ctx.beginPath();ctx.arc(m.x-m.r*.25,m.y-m.r*.2,m.r*.28,0,Math.PI*2);ctx.fill();
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#ffd34d";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1;

 if(gameOver){
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 48px Arial";ctx.fillText("GAME OVER",W/2,H/2-40);
  ctx.font="20px Arial";ctx.fillText("Score: "+Math.floor(score)+" • Best: "+best,W/2,H/2);
  ctx.fillStyle="#ffd34d";ctx.font="bold 17px Arial";ctx.fillText("Tap the joystick or press SPACE to restart",W/2,H/2+42);
  ctx.textAlign="left";
 }
}
function loop(t){
 const dt=Math.min((t-last)/1000||0,.033);last=t;
 if(running)update(dt);
 draw();
 requestAnimationFrame(loop);
}
reset();renderMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
