<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Rush</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; overflow: hidden; background: #07111f;
    font-family: Arial, sans-serif; color: white;
  }
  canvas { display:block; width:100vw; height:100vh; }
  #help {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    padding: 9px 14px; border-radius: 12px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(5px);
    font-size: 14px; text-align:center; pointer-events:none;
  }
  #start {
    position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
    background: rgba(3,8,18,.72);
  }
  .panel {
    width:min(520px,90vw); text-align:center; padding:34px;
    border:1px solid rgba(255,255,255,.15); border-radius:24px;
    background: rgba(13,27,48,.94); box-shadow:0 20px 80px rgba(0,0,0,.45);
  }
  h1 { margin:0 0 8px; font-size:48px; letter-spacing:2px; }
  p { color:#b8c7dc; line-height:1.5; }
  button {
    border:0; border-radius:14px; padding:14px 30px; font-size:18px;
    font-weight:bold; cursor:pointer; background:#ffd34d; color:#17120a;
  }
  button:hover { filter:brightness(1.08); }

  #touchControls{display:none;position:fixed;left:18px;bottom:18px;width:156px;height:156px;touch-action:none;user-select:none;z-index:10}
  .touchBtn{position:absolute;width:54px;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(20,35,58,.78);color:white;font-size:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;touch-action:none}
  .touchBtn:active{background:rgba(255,211,77,.85);color:#111}
  #touchUp{left:51px;top:0}#touchLeft{left:0;top:51px}#touchRight{right:0;top:51px}#touchDown{left:51px;bottom:0}
  @media (pointer:coarse),(max-width:700px){#touchControls{display:block}#help{bottom:8px;font-size:11px;opacity:.7}h1{font-size:38px}.panel{padding:26px 20px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start">
  <div class="panel">
    <h1>SKY RUSH</h1>
    <p>Collect the golden stars, dodge the red meteors, and survive as long as you can.</p>
    <p><b>Controls:</b> WASD / Arrow Keys · Collect ⭐ · Avoid ☄️</p>
    <button id="play">PLAY</button>
  </div>
</div>

<div id="help">Move: WASD / Arrow Keys · ⭐ Collect stars · ☄️ Avoid meteors</div><div id="touchControls"><div class="touchBtn" id="touchUp">▲</div><div class="touchBtn" id="touchLeft">◀</div><div class="touchBtn" id="touchRight">▶</div><div class="touchBtn" id="touchDown">▼</div></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const start = document.getElementById("start");
const play = document.getElementById("play");

let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))
    e.preventDefault();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);


// Mobile touch controls
const touchMap={touchUp:"arrowup",touchDown:"arrowdown",touchLeft:"arrowleft",touchRight:"arrowright"};
for(const id in touchMap){const el=document.getElementById(id),key=touchMap[id];const press=e=>{e.preventDefault();if(gameOver)reset();keys[key]=true;};const release=e=>{e.preventDefault();keys[key]=false;};el.addEventListener("pointerdown",press);el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);el.addEventListener("pointerleave",release);}

let player, stars, meteors, particles, score, best, gameOver, running, spawnTimer, starTimer, last;

try { best = Number(localStorage.getItem("skyRushBest") || 0); }
catch { best = 0; }

function reset() {
  player = {x:W/2, y:H/2, r:18, speed:5.4};
  stars = [];
  meteors = [];
  particles = [];
  score = 0;
  gameOver = false;
  spawnTimer = 0;
  starTimer = 0;
  for(let i=0;i<3;i++) spawnStar();
  for(let i=0;i<2;i++) spawnMeteor();
}

function rand(a,b){ return a + Math.random()*(b-a); }

function spawnStar() {
  stars.push({x:rand(40,W-40), y:rand(80,H-40), r:11, spin:rand(0,6.28)});
}
function spawnMeteor() {
  const side = Math.floor(rand(0,4));
  let x,y,vx,vy;
  if(side===0){x=-30;y=rand(0,H);vx=rand(2,4);vy=rand(-1.5,1.5);}
  if(side===1){x=W+30;y=rand(0,H);vx=-rand(2,4);vy=rand(-1.5,1.5);}
  if(side===2){x=rand(0,W);y=-30;vx=rand(-1.5,1.5);vy=rand(2,4);}
  if(side===3){x=rand(0,W);y=H+30;vx=rand(-1.5,1.5);vy=-rand(2,4);}
  meteors.push({x,y,vx,vy,r:rand(15,25),rot:rand(0,6.28)});
}

function burst(x,y,amount=14) {
  for(let i=0;i<amount;i++){
    const a=rand(0,Math.PI*2), s=rand(1,5);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(2,5)});
  }
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function update(dt) {
  if(gameOver) return;

  let dx=(keys["d"]||keys["arrowright"]?1:0)-(keys["a"]||keys["arrowleft"]?1:0);
  let dy=(keys["s"]||keys["arrowdown"]?1:0)-(keys["w"]||keys["arrowup"]?1:0);
  if(dx||dy){
    const len=Math.hypot(dx,dy); dx/=len; dy/=len;
    player.x += dx*player.speed*dt*60;
    player.y += dy*player.speed*dt*60;
  }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(65,Math.min(H-player.r,player.y));

  starTimer += dt;
  if(starTimer>2.2 && stars.length<5){ spawnStar(); starTimer=0; }

  spawnTimer += dt;
  const interval=Math.max(.45,1.25-score/180);
  if(spawnTimer>interval){ spawnMeteor(); spawnTimer=0; }

  stars.forEach(s=>s.spin += dt*3);
  meteors.forEach(m=>{m.x+=m.vx*dt*60;m.y+=m.vy*dt*60;m.rot+=dt*2;});
  meteors=meteors.filter(m=>m.x>-80&&m.x<W+80&&m.y>-80&&m.y<H+80);

  for(let i=stars.length-1;i>=0;i--){
    if(dist(player,stars[i])<player.r+stars[i].r){
      score+=10; burst(stars[i].x,stars[i].y,18); stars.splice(i,1);
    }
  }

  for(const m of meteors){
    if(dist(player,m)<player.r+m.r-5){
      burst(player.x,player.y,35);
      gameOver=true;
      best=Math.max(best,score);
      try{localStorage.setItem("skyRushBest",best)}catch{}
      break;
    }
  }

  particles.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt*1.7;p.vx*=.98;p.vy*=.98;});
  particles=particles.filter(p=>p.life>0);
  score += dt*1.5;
}

function starPath(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r:r*.42, a=rot+i*Math.PI/5;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}

function draw() {
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0b2340"); g.addColorStop(1,"#07101d");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // stars in background
  ctx.fillStyle="rgba(255,255,255,.65)";
  for(let i=0;i<90;i++){
    const x=(i*97)%W, y=(i*53)%H;
    ctx.globalAlpha=.25+((i*17)%70)/100;
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle="rgba(4,10,20,.55)";
  ctx.fillRect(0,0,W,58);
  ctx.font="bold 20px Arial";
  ctx.fillStyle="#fff";
  ctx.fillText("⭐ "+Math.floor(score),22,36);
  ctx.fillStyle="#9fb2cc";
  ctx.font="15px Arial";
  ctx.fillText("BEST: "+best,140,36);

  // player glow
  const glow=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,45);
  glow.addColorStop(0,"rgba(82,190,255,.5)");
  glow.addColorStop(1,"rgba(82,190,255,0)");
  ctx.fillStyle=glow; ctx.beginPath();ctx.arc(player.x,player.y,45,0,Math.PI*2);ctx.fill();

  // player
  ctx.save(); ctx.translate(player.x,player.y);
  ctx.fillStyle="#4fc3ff"; ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#e9f8ff"; ctx.beginPath();ctx.arc(-6,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#12243c"; ctx.beginPath();ctx.arc(-7,-5,2,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // stars
  for(const s of stars){
    ctx.save(); starPath(s.x,s.y,s.r,s.spin); ctx.fillStyle="#ffd34d";ctx.shadowBlur=15;ctx.shadowColor="#ffd34d";ctx.fill();ctx.restore();
  }

  // meteors
  for(const m of meteors){
    ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);
    ctx.fillStyle="#d94b4b";ctx.beginPath();
    for(let i=0;i<9;i++){
      const a=i*Math.PI*2/9, rr=m.r*(.8+Math.sin(i*7)*.18);
      const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#ff9b4a";ctx.beginPath();ctx.arc(-m.r*.25,-m.r*.2,m.r*.28,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#ffd34d";
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#fff";ctx.font="bold 52px Arial";ctx.fillText("GAME OVER",W/2,H/2-45);
    ctx.font="22px Arial";ctx.fillText("Score: "+Math.floor(score)+"   •   Best: "+best,W/2,H/2);
    ctx.fillStyle="#ffd34d";ctx.font="bold 18px Arial";ctx.fillText("Press SPACE or tap a direction to play again",W/2,H/2+48);
    ctx.textAlign="left";
  }
}

function loop(t){
  if(!last) last=t;
  const dt=Math.min((t-last)/1000,.033); last=t;
  if(running) update(dt);
  draw();
  requestAnimationFrame(loop);
}
play.onclick=()=>{start.style.display="none";running=true;reset();};
addEventListener("keydown",e=>{
  if(e.code==="Space" && gameOver){reset();}
});
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
